name: Deploy OMARO ontology and reference dataset

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy-release:
    timeout-minutes: 15
    if: ${{ !github.event.repository.private && vars.OMARO_ENABLE_PUBLIC_PAGES == 'true' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.13"
          cache: pip
      - name: Download the published distribution
        run: |
          curl --fail --location --retry 3 --output omaro-v0.1.0.zip \
            https://github.com/modavis-project/omaro/releases/download/v0.1.0/omaro-v0.1.0.zip
          echo "d55118d7dae2925962fdf1100549356cc2d26a4cd1467c47e8ba171e1be4ca4d  omaro-v0.1.0.zip" | sha256sum --check
          unzip -q omaro-v0.1.0.zip 'omaro-v0.1.0/dist/*' -d .release
      - run: python scripts/test_pages.py
      - name: Verify and stage the release files
        run: python scripts/stage_pages.py --source .release/omaro-v0.1.0/dist --browser-source site
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: .pages-site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
