name: Deploy OMARO ontology and reference dataset

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    if: ${{ !github.event.repository.private && vars.OMARO_ENABLE_PUBLIC_PAGES == 'true' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.13"
          cache: pip
      - run: pip install -r requirements-lock.txt
      - run: pip install --no-deps -e .
      - run: omaro build
      - run: omaro validate
      - name: Test in bounded processes
        run: |
          for group in formats package replay semantics; do
            python scripts/run_tests.py --group "$group"
          done
          python scripts/run_tests.py --verify-reports
      - run: python scripts/test_pages.py
      - run: python scripts/stage_pages.py
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: .pages-site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
