name: Build and attest tagged release artifacts

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

env:
  PYTHONUNBUFFERED: "1"
  MALLOC_ARENA_MAX: "2"

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.13"
          cache: pip
      - run: pip install -r requirements-lock.txt
      - run: pip install --no-deps -e .
      - run: omaro validate
      - run: omaro build
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - name: Prepare the corpus for every test group
        run: python -c "from pathlib import Path; from omaro.builder import package; package(Path('.'), Path('dist'), '0.1.0')"
      - run: sha256sum --check SHA256SUMS
      - run: python scripts/release_check.py
      - run: python scripts/test_pages.py
      - run: python scripts/stage_pages.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prepared-release
          retention-days: 2
          compression-level: 0
          path: |
            omaro-v0.1.0.zip
            omaro-v0.1.0.dcat.ttl
            SHA256SUMS

  test:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        group: [formats, package, replay, semantics]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.13"
          cache: pip
      - run: pip install -r requirements-lock.txt
      - run: pip install --no-deps -e .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: prepared-release
          path: .ci/package
      - name: Restore the verified corpus
        run: |
          (cd .ci/package && sha256sum --check SHA256SUMS)
          unzip -q .ci/package/omaro-v0.1.0.zip 'omaro-v0.1.0/dist/*' -d .ci/package/extracted
          mv .ci/package/extracted/omaro-v0.1.0/dist dist
      - name: Test with process isolation and visible progress
        run: /usr/bin/time -v python scripts/run_tests.py --group "${{ matrix.group }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-result-${{ matrix.group }}
          retention-days: 2
          path: test-results

  package:
    needs: [prepare, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.13"
          cache: pip
      - run: pip install -r requirements-lock.txt
      - run: pip install --no-deps -e .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: prepared-release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: test-result-*
          path: test-results
          merge-multiple: true
      - name: Require successful execution of every collected test
        run: python scripts/run_tests.py --verify-reports
      - run: sha256sum --check SHA256SUMS
      - if: ${{ !github.event.repository.private }}
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-checksums: SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: omaro-v0.1.0
          compression-level: 0
          path: |
            omaro-v0.1.0.zip
            omaro-v0.1.0.dcat.ttl
            SHA256SUMS
