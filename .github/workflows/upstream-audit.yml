name: Audit MIMO upstream changes

on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: ${{ vars.OMARO_ENABLE_UPSTREAM_AUDIT == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.13"
          cache: pip
      - run: pip install -r requirements-lock.txt
      - run: pip install --no-deps -e .
      - name: Refresh candidate without publishing
        run: omaro refresh-source --workers 2
      - run: omaro build
      - name: Test refreshed candidate
        id: candidate-tests
        continue-on-error: true
        run: pytest
      - name: Create review artifacts
        run: |
          git diff --no-ext-diff -- data/canonical hornbostelSachs.json translations.json QUALITY_REPORT.md > upstream.patch
          git diff --stat -- data/canonical hornbostelSachs.json translations.json QUALITY_REPORT.md > upstream-summary.txt
          cp dist/quality-report.json upstream-quality-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mimo-upstream-audit
          path: |
            upstream.patch
            upstream-summary.txt
            upstream-quality-report.json
          retention-days: 30
      - name: Fail after preserving a failing candidate
        if: steps.candidate-tests.outcome == 'failure'
        run: exit 1
